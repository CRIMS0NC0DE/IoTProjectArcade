<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel IoT · Arcade Cloud Score</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/arcade.css">
  <script src="/arcade.js"></script>
  <style>
    /* Jogo aberto no Batocera: os LEDs do painel piscam em sequência, como os de verdade */
    @keyframes festa { 0%, 33% { opacity: 1; box-shadow: 0 0 18px currentColor; } 34%, 100% { opacity: .15; box-shadow: none; } }
    .festa { animation: festa .45s step-end infinite; }
    @media (prefers-reduced-motion: reduce) { .festa { animation: none; opacity: 1 !important; } }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 font-mono">
  <main class="max-w-3xl mx-auto px-4 py-10">
    <nav class="mb-6 flex justify-between text-xs tracking-widest">
      <a class="text-slate-400 hover:text-yellow-300" href="/">◀ RANKING</a>
      <span id="nav"></span>
    </nav>
    <h1 class="glow text-center text-3xl sm:text-5xl font-bold tracking-[0.25em] text-yellow-400">PAINEL IoT</h1>
    <p id="status" class="mt-3 mb-8 text-center text-sm tracking-widest text-slate-500">● CONECTANDO</p>

    <div id="cards" class="grid gap-4 sm:grid-cols-3 transition-opacity">
      <section class="rounded-lg border border-slate-800 bg-slate-950 p-4">
        <h2 class="text-xs tracking-widest text-yellow-400/80">TEMPERATURA</h2>
        <p class="mt-4 text-5xl font-bold text-slate-100"><span id="temp">—</span><span class="text-2xl text-slate-400"> °C</span></p>
        <p class="mt-3 text-sm text-slate-400">umidade <span id="hum" class="text-slate-200">—</span></p>
        <p class="mt-4 text-xs text-slate-500">sensor DHT11 no ESP32</p>
      </section>

      <section class="rounded-lg border border-slate-800 bg-slate-950 p-4">
        <h2 class="text-xs tracking-widest text-yellow-400/80">JOYSTICK</h2>
        <div class="relative mx-auto mt-3 h-32 w-32 rounded-full border border-slate-700 bg-slate-900">
          <span class="absolute left-1/2 top-0 h-full w-px bg-slate-800"></span>
          <span class="absolute top-1/2 left-0 h-px w-full bg-slate-800"></span>
          <span id="dot" class="absolute h-4 w-4 -translate-x-1/2 -translate-y-1/2 rounded-full bg-yellow-400 shadow-[0_0_10px_rgba(250,204,21,.7)] transition-all duration-100" style="left: 50%; top: 50%"></span>
        </div>
        <p id="dir" class="mt-3 text-center text-sm">centro</p>
        <p class="text-center text-xs text-slate-500 tabular-nums">X <span id="jx">0</span> · Y <span id="jy">0</span></p>
      </section>

      <section class="rounded-lg border border-slate-800 bg-slate-950 p-4">
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-xs tracking-widest text-yellow-400/80">LEDS</h2>
          <span id="playing" class="hidden rounded bg-yellow-400 px-1.5 py-0.5 text-[10px] font-bold tracking-widest text-slate-950">JOGO ABERTO</span>
        </div>
        <div id="leds" class="mt-4 flex justify-around"></div>
        <div id="modes" class="mt-4 grid grid-cols-2 overflow-hidden rounded border border-slate-700 text-xs tracking-widest"></div>
        <p id="ledmsg" class="mt-2 min-h-[2.5rem] text-xs text-slate-500"></p>
      </section>
    </div>

    <section class="mt-4 rounded-lg border border-slate-800 bg-slate-950 p-4">
      <div class="flex items-center justify-between gap-2">
        <h2 class="text-xs tracking-widest text-yellow-400/80">TEMPERATURA NO TEMPO</h2>
        <div id="ranges" class="flex gap-1 text-xs"></div>
      </div>
      <div id="chart" class="relative mt-3 h-56"></div>
      <details class="mt-3 text-xs text-slate-400">
        <summary class="cursor-pointer hover:text-yellow-300">Ver tabela</summary>
        <div class="mt-2 max-h-64 overflow-y-auto">
          <table class="w-full text-left">
            <thead class="text-slate-500"><tr><th class="py-1">HORA</th><th class="py-1 text-right">TEMPERATURA</th><th class="py-1 text-right">UMIDADE</th></tr></thead>
            <tbody id="table" class="tabular-nums text-slate-300"></tbody>
          </table>
        </div>
      </details>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const LEDS = [
      { key: "green", name: "VERDE", color: "#22c55e" },
      { key: "yellow", name: "AMARELO", color: "#eab308" },
      { key: "red", name: "VERMELHO", color: "#ef4444" },
    ];
    const MODES = [{ key: "joystick", name: "JOYSTICK" }, { key: "site", name: "SITE" }];
    const RANGES = [1, 6, 24];  // horas
    const OFFLINE_AFTER = 6000;  // ms sem leitura: o ESP32 manda pelo menos uma a cada 2 s
    const LINE = "#d95926", GRID = "#1e293b", AXIS = "#64748b", INK = "#cbd5e1", SURFACE = "#020617";

    let me = null, state = null, lastSeen = 0, deviceId = null, wsOpen = false, sending = false;
    let hours = 1, history = [];

    const fmt1 = (v) => v == null ? "—" : v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const fmtPct = (v) => v == null ? "—" : `${Math.round(v)}%`;
    const fmtTime = (ts) => new Date(ts * 1000).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

    function direction(x, y) {  // o mesmo critério do protótipo do ESP32
      const v = y < 0 ? "cima" : y > 0 ? "baixo" : "";
      const h = x < 0 ? "esquerda" : x > 0 ? "direita" : "";
      return v && h ? `${v}-${h}` : v || h || "centro";
    }

    // ---------- ao vivo ----------

    function online() {
      return state && Date.now() - lastSeen < OFFLINE_AFTER;
    }

    function setStatus() {
      let text = "● AGUARDANDO O ESP32", color = "text-slate-500";
      if (!wsOpen) [text, color] = ["● RECONECTANDO", "text-red-500"];
      else if (online()) [text, color] = [`● AO VIVO · ${state.device_id}${state.playing ? " · JOGANDO" : ""}`, "text-green-400"];
      else if (state) [text, color] = [`● ESP32 OFFLINE · última leitura ${fmtTime(lastSeen / 1000)}`, "text-red-500"];
      $("status").textContent = text;
      $("status").className = `mt-3 mb-8 text-center text-sm tracking-widest ${color}`;
      $("cards").classList.toggle("opacity-50", !online());
      renderControls();
    }

    function renderLive() {
      $("temp").textContent = fmt1(state.temperature);
      $("hum").textContent = fmtPct(state.humidity);
      $("dot").style.left = `${50 + (state.x / 255) * 50}%`;
      $("dot").style.top = `${50 + (state.y / 255) * 50}%`;
      $("dir").textContent = direction(state.x, state.y);
      $("jx").textContent = state.x;
      $("jy").textContent = state.y;
      $("playing").classList.toggle("hidden", !state.playing);
      for (const led of LEDS) {
        const b = state.leds[led.key];
        const lamp = $(`lamp-${led.key}`);
        lamp.classList.toggle("festa", Boolean(state.playing));  // a animação manda: o brilho lido é só um instante dela
        lamp.style.opacity = 0.15 + (0.85 * b) / 255;
        lamp.style.boxShadow = b ? `0 0 ${4 + (16 * b) / 255}px ${led.color}` : "none";
        $(`pct-${led.key}`).textContent = state.playing ? "—" : `${Math.round(b / 2.55)}%`;
        $(`led-${led.key}`).setAttribute("aria-pressed", b > 0);
      }
      setStatus();
    }

    function buildControls() {
      $("leds").innerHTML = LEDS.map((led, i) => `
        <button id="led-${led.key}" class="flex flex-col items-center gap-2 rounded p-1 disabled:cursor-not-allowed" aria-pressed="false" title="Ligar/desligar ${led.name.toLowerCase()}">
          <span id="lamp-${led.key}" class="h-10 w-10 rounded-full transition-all duration-100" style="background: ${led.color}; color: ${led.color}; opacity: .15; animation-delay: ${i * 0.15}s"></span>
          <span class="text-[10px] tracking-widest text-slate-400">${led.name}</span>
          <span id="pct-${led.key}" class="text-xs tabular-nums text-slate-300">0%</span>
        </button>`).join("");
      $("modes").innerHTML = MODES.map((m) => `
        <button id="mode-${m.key}" class="py-2 disabled:cursor-not-allowed">${m.name}</button>`).join("");
      for (const led of LEDS) {
        $(`led-${led.key}`).onclick = () => command("/api/iot/led", { color: led.key, on: !(state.leds[led.key] > 0) });
      }
      for (const m of MODES) $(`mode-${m.key}`).onclick = () => command("/api/iot/mode", { mode: m.key });
    }

    function renderControls() {
      const enabled = Boolean(me && online() && !sending && !state?.playing);
      for (const b of document.querySelectorAll("#leds button, #modes button")) b.disabled = !enabled;
      for (const m of MODES) {
        const active = state?.mode === m.key;
        $(`mode-${m.key}`).className = `py-2 disabled:cursor-not-allowed ${active ? "bg-yellow-400 text-slate-950 font-bold" : "text-slate-400 hover:text-yellow-300"}`;
      }
      if (!me) {
        $("ledmsg").innerHTML = '<a class="text-yellow-400 hover:text-yellow-300" href="/login.html">ENTRE</a> para controlar os LEDs.';
      } else if (state?.playing) {
        $("ledmsg").textContent = "Jogo aberto no arcade: os LEDs estão piscando. O controle pelo site volta quando o jogo terminar.";
      } else if (!sending && !$("ledmsg").dataset.error) {
        $("ledmsg").textContent = state?.mode === "site"
          ? "Modo site: clique num LED para ligar ou desligar."
          : "Modo joystick: os LEDs seguem o analógico. Clicar num LED passa para o modo site.";
      }
    }

    async function command(path, body) {
      sending = true;
      delete $("ledmsg").dataset.error;
      $("ledmsg").textContent = "Enviando…";
      renderControls();
      try {
        await api(path, { method: "POST", body: JSON.stringify({ device_id: deviceId, ...body }) });
      } catch (err) {
        $("ledmsg").dataset.error = "1";
        $("ledmsg").textContent = err.message;
        setTimeout(() => { delete $("ledmsg").dataset.error; renderControls(); }, 4000);
      } finally {
        sending = false;
        renderControls();
      }
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/ws/iot`);
      ws.onopen = () => { wsOpen = true; setStatus(); };
      ws.onmessage = (event) => {
        const s = JSON.parse(event.data);
        // Um arcade por painel: outro aparelho só assume o lugar se o atual estiver offline.
        if (s.device_id !== deviceId) {
          if (online()) return;
          deviceId = s.device_id;
          loadHistory();
        }
        state = s;
        lastSeen = s.snapshot ? s.received_at * 1000 : Date.now();
        renderLive();
      };
      ws.onclose = () => { wsOpen = false; setStatus(); setTimeout(connect, 2000); };
    }

    // ---------- histórico ----------

    function buildRanges() {
      $("ranges").innerHTML = RANGES.map((h) => `<button data-h="${h}" class="rounded px-2 py-1">${h} h</button>`).join("");
      for (const b of $("ranges").children) b.onclick = () => { hours = Number(b.dataset.h); loadHistory(); };
    }

    async function loadHistory() {
      for (const b of $("ranges").children) {
        b.className = `rounded px-2 py-1 ${Number(b.dataset.h) === hours ? "bg-slate-800 text-yellow-400" : "text-slate-400 hover:text-yellow-300"}`;
      }
      const q = new URLSearchParams({ hours });
      if (deviceId) q.set("device_id", deviceId);
      try {
        history = await api(`/api/iot/history?${q}`);
      } catch {
        return;  // tenta de novo no próximo ciclo
      }
      drawChart();
      $("table").innerHTML = [...history].reverse().map((p) => `
        <tr class="border-t border-slate-900"><td class="py-1">${fmtTime(p.ts)}</td>
        <td class="py-1 text-right">${fmt1(p.temperature)} °C</td><td class="py-1 text-right">${fmtPct(p.humidity)}</td></tr>`).join("");
    }

    function drawChart() {
      const box = $("chart");
      const now = Date.now() / 1000, x0 = now - hours * 3600;
      const pts = history.filter((p) => p.ts >= x0);
      if (!pts.length) {
        box.innerHTML = '<p class="flex h-full items-center justify-center text-center text-sm text-slate-500">Sem leituras nesse período ainda.<br>O banco guarda uma leitura por minuto.</p>';
        return;
      }
      const W = box.clientWidth, H = box.clientHeight, m = { l: 32, r: 64, t: 12, b: 24 };
      const temps = pts.map((p) => p.temperature);
      let lo = Math.floor(Math.min(...temps)) - 1, hi = Math.ceil(Math.max(...temps)) + 1;
      const step = hi - lo <= 6 ? 1 : hi - lo <= 12 ? 2 : 5;
      lo = Math.floor(lo / step) * step;
      hi = Math.ceil(hi / step) * step;
      const sx = (t) => m.l + ((t - x0) / (now - x0)) * (W - m.l - m.r);
      const sy = (v) => m.t + ((hi - v) / (hi - lo)) * (H - m.t - m.b);

      let svg = "";
      for (let v = lo; v <= hi; v += step) {
        svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="${GRID}" stroke-width="1"/>`;
        svg += `<text x="${m.l - 6}" y="${sy(v) + 4}" text-anchor="end" fill="${AXIS}" font-size="11">${v}</text>`;
      }
      const ticks = W < 480 ? 2 : 4;  // no celular, horários a cada quarto do gráfico se encostam
      for (let i = 0; i <= ticks; i++) {
        const t = x0 + (i / ticks) * (now - x0);
        const anchor = i === 0 ? "start" : i === ticks ? "end" : "middle";
        svg += `<text x="${sx(t)}" y="${H - 6}" text-anchor="${anchor}" fill="${AXIS}" font-size="11">${fmtTime(t)}</text>`;
      }
      // A linha se interrompe onde faltam leituras (ESP32 ou arcade desligados).
      const d = pts.map((p, i) => `${i && p.ts - pts[i - 1].ts <= 180 ? "L" : "M"}${sx(p.ts).toFixed(1)},${sy(p.temperature).toFixed(1)}`).join("");
      svg += `<path d="${d}" fill="none" stroke="${LINE}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const last = pts.at(-1);
      svg += `<circle cx="${sx(last.ts)}" cy="${sy(last.temperature)}" r="4" fill="${LINE}" stroke="${SURFACE}" stroke-width="2"/>`;
      svg += `<text x="${sx(last.ts) + 8}" y="${sy(last.temperature) + 4}" fill="${INK}" font-size="12">${fmt1(last.temperature)} °C</text>`;
      svg += `<line id="cross" y1="${m.t}" y2="${H - m.b}" stroke="${AXIS}" stroke-width="1" visibility="hidden"/>`;
      svg += `<circle id="hover" r="4" fill="${LINE}" stroke="${SURFACE}" stroke-width="2" visibility="hidden"/>`;

      box.innerHTML = `
        <svg width="${W}" height="${H}" tabindex="0" class="outline-none focus-visible:ring-1 focus-visible:ring-yellow-400 rounded"
             role="img" aria-label="Temperatura nas últimas ${hours} h: de ${fmt1(Math.min(...temps))} a ${fmt1(Math.max(...temps))} °C">${svg}</svg>
        <div id="tip" class="pointer-events-none absolute top-2 hidden rounded border border-slate-700 bg-slate-900 px-2 py-1 text-xs shadow-lg">
          <div id="tip-temp" class="text-sm font-bold text-slate-100"></div>
          <div id="tip-hum" class="text-slate-400"></div>
          <div id="tip-time" class="text-slate-500"></div>
        </div>`;

      const el = box.querySelector("svg");
      let index = pts.length - 1;
      const show = (i) => {
        index = i;
        const p = pts[i], x = sx(p.ts);
        $("cross").setAttribute("x1", x); $("cross").setAttribute("x2", x);
        $("cross").setAttribute("visibility", "visible");
        $("hover").setAttribute("cx", x); $("hover").setAttribute("cy", sy(p.temperature));
        $("hover").setAttribute("visibility", "visible");
        $("tip-temp").textContent = `${fmt1(p.temperature)} °C`;
        $("tip-hum").textContent = `umidade ${fmtPct(p.humidity)}`;
        $("tip-time").textContent = fmtTime(p.ts);
        const tip = $("tip");
        tip.classList.remove("hidden");
        tip.style.left = `${Math.min(Math.max(x + 12, 0), W - tip.offsetWidth)}px`;
      };
      const hide = () => {
        $("cross").setAttribute("visibility", "hidden");
        $("hover").setAttribute("visibility", "hidden");
        $("tip").classList.add("hidden");
      };
      el.addEventListener("pointermove", (e) => {
        const px = e.clientX - el.getBoundingClientRect().left;
        let best = 0;
        for (let i = 1; i < pts.length; i++) if (Math.abs(sx(pts[i].ts) - px) < Math.abs(sx(pts[best].ts) - px)) best = i;
        show(best);
      });
      el.addEventListener("pointerleave", hide);
      el.addEventListener("focus", () => show(index));
      el.addEventListener("blur", hide);
      el.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" && index > 0) show(index - 1);
        else if (e.key === "ArrowRight" && index < pts.length - 1) show(index + 1);
        else return;
        e.preventDefault();
      });
    }

    buildControls();
    buildRanges();
    renderNav($("nav")).then((user) => { me = user; renderControls(); });
    connect();
    loadHistory();
    setInterval(setStatus, 1000);
    setInterval(loadHistory, 60000);
    window.addEventListener("resize", drawChart);
  </script>
</body>
</html>
