<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcade Cloud Score</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/arcade.css">
  <script src="/arcade.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 font-mono">
  <main class="max-w-3xl mx-auto px-4 py-10">
    <nav id="nav" class="mb-6 text-right text-xs tracking-widest"></nav>
    <h1 class="glow text-center text-3xl sm:text-5xl font-bold tracking-[0.25em] text-yellow-400">HIGH SCORES</h1>
    <p id="status" class="mt-3 mb-8 text-center text-sm tracking-widest text-slate-500">● CONECTANDO</p>

    <div class="overflow-x-auto rounded-lg border border-slate-800">
      <table class="w-full text-left text-sm sm:text-base">
        <thead class="bg-slate-900 text-xs tracking-widest text-yellow-400/80">
          <tr>
            <th class="px-3 py-3 w-10">#</th>
            <th class="px-3 py-3">TAG</th>
            <th class="px-3 py-3">JOGO</th>
            <th class="px-3 py-3 text-right">FASE</th>
            <th class="px-3 py-3 text-right">SCORE</th>
          </tr>
        </thead>
        <tbody id="board" class="divide-y divide-slate-800">
          <tr><td colspan="5" class="px-3 py-10 text-center text-slate-500">Carregando…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const board = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const PODIUM = ["text-yellow-400", "text-slate-300", "text-amber-600"];

    function render(scores) {
      if (!scores.length) {
        board.innerHTML = '<tr><td colspan="5" class="px-3 py-10 text-center text-slate-500">Nenhuma partida registrada ainda</td></tr>';
        return;
      }
      board.innerHTML = scores.map((s, i) => `
        <tr class="${PODIUM[i] ?? ""} hover:bg-slate-900/60">
          <td class="px-3 py-2 text-slate-500">${i + 1}</td>
          <td class="px-3 py-2 font-bold">${esc(s.player_tag)}</td>
          <td class="px-3 py-2 max-w-[12rem] truncate" title="${esc(s.game)}">${esc(s.game)}</td>
          <td class="px-3 py-2 text-right">${Number(s.stage_reached)}</td>
          <td class="px-3 py-2 text-right tabular-nums">${fmtScore(s.score)}</td>
        </tr>`).join("");
    }

    function setStatus(text, color) {
      statusEl.textContent = text;
      statusEl.className = `mt-3 mb-8 text-center text-sm tracking-widest ${color}`;
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => setStatus("● AO VIVO", "text-green-400");
      ws.onmessage = (event) => render(JSON.parse(event.data));
      ws.onclose = () => {
        setStatus("● RECONECTANDO", "text-red-500");
        setTimeout(connect, 2000);
      };
    }

    renderNav(document.getElementById("nav"));
    connect();
  </script>
</body>
</html>
