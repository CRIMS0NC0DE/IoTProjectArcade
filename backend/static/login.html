<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Arcade Cloud Score</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/arcade.css">
  <script src="/arcade.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 font-mono">
  <main class="max-w-sm mx-auto px-4 py-10">
    <nav class="mb-6 text-xs tracking-widest"><a class="text-slate-400 hover:text-yellow-300" href="/">◀ RANKING</a></nav>
    <h1 class="glow text-center text-3xl font-bold tracking-[0.25em] text-yellow-400">PLAYER</h1>

    <div class="mt-8 grid grid-cols-2 text-center text-xs tracking-widest" role="tablist">
      <button data-tab="login" class="tab py-3 border-b-2">ENTRAR</button>
      <button data-tab="register" class="tab py-3 border-b-2">CRIAR CONTA</button>
    </div>

    <p id="error" role="alert" class="hidden mt-6 whitespace-pre-line rounded border border-red-500/50 bg-red-500/10 px-3 py-2 text-sm text-red-300"></p>

    <form id="login" class="mt-6 space-y-4" novalidate>
      <label class="block text-xs tracking-widest text-slate-400">USUÁRIO
        <input name="username" required autocomplete="username" autocapitalize="none"
               class="mt-1 w-full rounded bg-slate-900 border border-slate-700 px-3 py-2 text-base text-slate-100 focus:border-yellow-400 focus:outline-none">
      </label>
      <label class="block text-xs tracking-widest text-slate-400">SENHA
        <input name="password" type="password" required autocomplete="current-password"
               class="mt-1 w-full rounded bg-slate-900 border border-slate-700 px-3 py-2 text-base text-slate-100 focus:border-yellow-400 focus:outline-none">
      </label>
      <button class="w-full rounded bg-yellow-400 py-3 font-bold tracking-widest text-slate-950 hover:bg-yellow-300 disabled:opacity-50">ENTRAR</button>
      <p class="text-center text-xs text-slate-500">Primeira vez aqui?
        <button type="button" data-tab="register" class="text-yellow-400 underline hover:text-yellow-300">Criar conta</button>
      </p>
    </form>

    <form id="register" class="hidden mt-6 space-y-4" novalidate>
      <label class="block text-xs tracking-widest text-slate-400">USUÁRIO
        <input name="username" maxlength="20" autocomplete="username" autocapitalize="none"
               class="mt-1 w-full rounded bg-slate-900 border border-slate-700 px-3 py-2 text-base text-slate-100 focus:border-yellow-400 focus:outline-none">
        <span class="mt-1 block normal-case tracking-normal text-slate-500">3 a 20 letras sem acento, números ou _ (sem espaços)</span>
      </label>
      <label class="block text-xs tracking-widest text-slate-400">TAG DO PLACAR
        <input name="player_tag" maxlength="3" autocapitalize="characters"
               class="mt-1 w-24 rounded bg-slate-900 border border-slate-700 px-3 py-2 text-center text-base uppercase tracking-[0.3em] text-yellow-400 focus:border-yellow-400 focus:outline-none">
        <span class="mt-1 block normal-case tracking-normal text-slate-500">1 a 3 letras ou números, como nos fliperamas</span>
      </label>
      <label class="block text-xs tracking-widest text-slate-400">SENHA
        <input name="password" type="password" maxlength="128" autocomplete="new-password"
               class="mt-1 w-full rounded bg-slate-900 border border-slate-700 px-3 py-2 text-base text-slate-100 focus:border-yellow-400 focus:outline-none">
      </label>
      <label class="block text-xs tracking-widest text-slate-400">CONFIRMAR SENHA
        <input name="confirm" type="password" maxlength="128" autocomplete="new-password"
               class="mt-1 w-full rounded bg-slate-900 border border-slate-700 px-3 py-2 text-base text-slate-100 focus:border-yellow-400 focus:outline-none">
      </label>
      <button class="w-full rounded bg-yellow-400 py-3 font-bold tracking-widest text-slate-950 hover:bg-yellow-300 disabled:opacity-50">CRIAR CONTA</button>
    </form>
  </main>

  <script>
    const errorEl = document.getElementById("error");
    const forms = { login: document.getElementById("login"), register: document.getElementById("register") };

    function showTab(name) {
      for (const [key, form] of Object.entries(forms)) form.classList.toggle("hidden", key !== name);
      for (const tab of document.querySelectorAll(".tab")) {
        const active = tab.dataset.tab === name;
        tab.className = `tab py-3 border-b-2 ${active ? "border-yellow-400 text-yellow-400" : "border-slate-800 text-slate-500 hover:text-slate-300"}`;
        tab.setAttribute("aria-selected", active);
      }
      errorEl.classList.add("hidden");
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.remove("hidden");
    }

    // Mesmas regras do backend, com mensagens que dizem o que corrigir.
    function registrationProblems(data) {
      const problems = [];
      if (!/^[a-z0-9_]{3,20}$/.test(data.username))
        problems.push("Usuário: 3 a 20 caracteres, só letras sem acento, números ou _ (sem espaços).");
      if (!/^[A-Z0-9]{1,3}$/.test(data.player_tag)) problems.push("Tag: 1 a 3 letras sem acento ou números.");
      if (data.password.length < 8) problems.push("Senha: pelo menos 8 caracteres.");
      else if (data.password !== data.confirm) problems.push("As senhas não conferem.");
      return problems;
    }

    async function submit(form, path, body) {
      const button = form.querySelector("button:not([type=button])");
      button.disabled = true;
      try {
        await api(path, { method: "POST", body: JSON.stringify(body) });
        location.href = "/perfil.html";
      } catch (err) {
        const hint = form === forms.login && err.status === 401 ? "\nAinda não tem conta? Clique em CRIAR CONTA." : "";
        showError(err.message + hint);
        button.disabled = false;
      }
    }

    forms.login.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(forms.login));
      if (!data.username.trim() || !data.password) return showError("Preencha usuário e senha.");
      submit(forms.login, "/api/auth/login", data);
    });

    forms.register.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(forms.register));
      data.username = data.username.trim().toLowerCase();
      data.player_tag = data.player_tag.trim().toUpperCase();
      const problems = registrationProblems(data);
      if (problems.length) return showError(problems.join("\n"));
      const { confirm, ...body } = data;
      submit(forms.register, "/api/auth/register", body);
    });

    for (const el of document.querySelectorAll("[data-tab]")) el.addEventListener("click", () => showTab(el.dataset.tab));
    showTab(location.hash === "#cadastro" ? "register" : "login");
  </script>
</body>
</html>
